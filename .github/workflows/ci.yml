name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: CLI smoke test
        run: node dist/cli.js generate --preset demo --days 2 --until none | head -n 3
      - name: Install the packed tarball and run its bin, as npm users will
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP" && npm init -y >/dev/null
          npm install ./ring-routine-sim-*.tgz
          npx ring-routine-sim presets
          node --input-type=module -e "import { generate, PRESETS } from 'ring-routine-sim'; console.log(generate(PRESETS.demo.options).length, 'events')"
